name: deploy-pipeline

on: 
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: SSH to EC2
              env:
                EC2_HOST: ${{ secrets.EC2_HOST }}
                EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
                EC2_USER: ${{ secrets.EC2_USER }}
              run: |
                echo "$EC2_SSH_KEY" > key.pem
                chmod 600 key.pem

                ssh -i key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST '
                  cd ~/simple-web-deployment-pipeline &&
                  git pull origin '"${{ github.ref_name }}"' &&

                  COMMIT_HASH=$(git rev-parse --short HEAD) &&

                  docker build -t web-app:$COMMIT_HASH -t web-app:latest -f docker/Dockerfile . &&

                  docker stop web-app || true &&
                  docker rm web-app || true &&

                  docker run -d --name web-app -p 8080:5000 --restart unless-stopped web-app:latest &&
                  
                  echo "$COMMIT_HASH" >> ~/simple-web-deployment-pipeline/script/version_history.txt 
                '